aid: ilik
name: ilik
description: >-
  Ilik (ilikhealth.com) is a direct-to-consumer telehealth company offering
  personalised prescription skincare designed and approved by dermatologists.
  Customers complete an online dermatology consultation, receive a custom AM/PM
  routine built from medical-grade, clinically proven ingredients, and have their
  prescription medication shipped free to their door — consulting with a
  dermatologist on their own time without the wait of an in-clinic appointment.
  The service is organised around skin concerns such as acne, anti-ageing,
  hyperpigmentation, and rosacea. Ilik is a consumer health / e-commerce brand
  and does not currently publish a public developer API, SDK, or documentation
  surface. It was surfaced as a portfolio company of 500 Global and added to the
  API Evangelist network for enrichment and monitoring.
